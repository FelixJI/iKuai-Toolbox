name: Integration Tests

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "golang_archive/**"
      - "rust_archive/**"
      - ".github/workflows/test-install-script.yml"
      - ".github/scripts/test-install-script.sh"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "golang_archive/**"
      - "rust_archive/**"
      - ".github/workflows/test-install-script.yml"
      - ".github/scripts/test-install-script.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    name: Build Frontend Dist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: frontends/app
        run: bun install --frozen-lockfile

      - name: Build frontend dist
        working-directory: frontends/app
        run: bun run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontends/app/dist

  go-tests:
    name: Go Unit & Smoke
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontends/app/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Why/为什么: go vet 加全仓测试一次跑齐；apps/integration-tests-go 的模拟器
      # smoke 包含在 ./... 内（harness 内部自行 go build 被测二进制）。
      # English: go vet plus the full test tree in one pass; the simulator
      # smokes from apps/integration-tests-go are part of ./... (the harness
      # builds the binary under test itself).
      - name: Go vet
        run: go vet ./...

      - name: Go unit and smoke tests
        run: go test ./... -count=1

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Frontend install dependencies
        shell: bash
        run: bun install --frozen-lockfile
        working-directory: frontends/app

      - name: Frontend type check
        shell: bash
        run: bun run check
        working-directory: frontends/app

      - name: Frontend unit tests
        shell: bash
        run: bun run test:ci
        working-directory: frontends/app

  tauri-tests:
    name: Tauri Backend Tests
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      # Why/为什么: cargo test 会执行 tauri-build，其资源校验要求 externalBin 声明的
      # Go sidecar 存在；sidecar 由 go build 产出，而根包 go:embed 又要求前端 dist。
      # English: cargo test runs tauri-build whose resource check requires the
      # externalBin Go sidecar; the sidecar comes from go build, and the root
      # go:embed in turn requires the frontend dist.
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontends/app/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Why/为什么: 根 workspace 已归档到 rust_archive/，apps/gui 是独立 crate。
          # English: the root workspace is archived under rust_archive/; apps/gui
          # is a standalone crate now.
          workspaces: |
            apps/gui -> target
          cache-on-failure: true
          shared-key: integration-smoke

      - name: Install Linux deps for Tauri build
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build Go sidecar for tauri-build resource check
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
            -o apps/gui/binaries/ikuai-bypass-go-x86_64-unknown-linux-gnu \
            ./cmd/ikuai-bypass

      # Why/为什么: apps/gui 已解耦为独立 crate（根 workspace 归档于 rust_archive/），
      # 测试直接在其目录内运行，`--locked` 依赖仓库内 apps/gui/Cargo.lock。
      # English: apps/gui is a standalone crate (root workspace archived under
      # rust_archive/); run tests in place, `--locked` relies on the committed
      # apps/gui/Cargo.lock.
      - name: Tauri backend command tests
        shell: bash
        working-directory: apps/gui
        run: cargo test --locked --test command_surface -- --nocapture
