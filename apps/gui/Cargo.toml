[package]
name = "ikb-app"
version = "4.4.109"
edition = "2024"
license = "AGPL-3.0"

[dependencies]
dirs = "6"
log = "0.4"
serde_yaml = "0.9"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["net", "time"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "ikb_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
